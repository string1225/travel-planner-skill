<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>旅行规划预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#163741;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}#stage{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:#f5f2ea}#visual{position:absolute;left:96px;top:160px;width:1728px;height:660px;object-fit:contain;background:#e4ece8}#title{position:absolute;left:96px;top:32px;right:96px;font-size:44px;line-height:1.3;white-space:pre-line;color:#153742}#source{position:absolute;left:96px;right:96px;top:854px;font-size:20px;line-height:1.2;white-space:pre-line;color:#49666d}#caption{position:absolute;left:150px;right:150px;bottom:72px;font-size:42px;line-height:1.2;white-space:pre-line;text-align:center;color:white;text-shadow:-2px -2px #000,2px 2px #000,2px -2px #000,-2px 2px #000}#controls{position:fixed;bottom:0;background:#163741;color:white;width:100%;height:70px;display:flex;gap:18px;align-items:center;justify-content:center}button{padding:10px 20px}input{width:50%}</style>
<div id="stage"><div id="title"></div><img id="visual" alt="旅行材料"><div id="source"></div><div id="caption"></div></div><audio id="voice" src="../voice.wav"></audio><div id="controls"><button id="play">播放</button><input id="seek" aria-label="播放进度" type="range" value="0" min="0" max="1000"><span id="clock"></span></div>
<script>const data=__DATA__;const voice=document.querySelector('#voice'),stage=document.querySelector('#stage');let index=-1,visual=document.querySelector('#visual');document.title=data.report.title;const end=data.timeline.at(-1).end_ms/1000;function fit(){let s=Math.min(innerWidth/1920,(innerHeight-70)/1080);stage.style.transform=`scale(${s})`;stage.style.left=(innerWidth-1920*s)/2+'px'}addEventListener('resize',fit);fit();function render(){const ms=voice.currentTime*1000;let n=data.timeline.findIndex(t=>ms>=t.start_ms&&ms<t.end_ms);if(n<0)n=ms>=end*1000?data.timeline.length-1:0;const m=data.visuals[n];if(n!==index){if(visual.tagName==='VIDEO')visual.pause();const next=document.createElement(m.kind==='video'?'video':'img');next.id='visual';next.src=m.path;if(m.kind==='video'){next.muted=true;next.playsInline=true;next.preload='auto'}else next.alt=m.title||data.report.scenes[n].title;visual.replaceWith(next);visual=next;visual.style.cssText=m.fallback?'left:0;top:0;width:1920px;height:1080px':'';document.querySelector('#title').textContent=m.fallback?'':m.title;document.querySelector('#source').textContent=m.fallback?'':m.label;index=n}if(m.kind==='video'){let desired=Math.min(m.clip_end,Math.max(m.clip_start,m.clip_start+(ms-data.timeline[n].start_ms)/1000));if(Number.isFinite(visual.duration))desired=Math.min(desired,Math.max(0,visual.duration-.04));if(Math.abs(visual.currentTime-desired)>.15)visual.currentTime=desired;if(!voice.paused&&desired<m.clip_end-.05)visual.play().catch(()=>{});else visual.pause()}const c=data.captions.find(c=>ms>=c.start_ms&&ms<c.end_ms);document.querySelector('#caption').textContent=c?.text||'';document.querySelector('#seek').value=Math.min(1000,voice.currentTime/end*1000);document.querySelector('#clock').textContent=Math.floor(voice.currentTime)+' / '+Math.ceil(end)+' 秒';document.querySelector('#play').textContent=voice.paused?'播放':'暂停';requestAnimationFrame(render)}document.querySelector('#play').onclick=()=>voice.paused?voice.play():voice.pause();document.querySelector('#seek').oninput=e=>voice.currentTime=end*Number(e.target.value)/1000;render();</script></html>
